version: "3.9"
services:
  db:
    image: postgres:16-alpine
    container_name: travelgo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: travelgo
      POSTGRES_USER: travelgo_user
      POSTGRES_PASSWORD: travelgo_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
name: Server CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  server-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install server dependencies
        working-directory: server
        run: npm ci || npm install

      - name: Prisma generate
        run: npx prisma generate

      - name: Basic boot check
        working-directory: server
        run: node -e "console.log('Server install OK')"

      - name: List API files
        run: ls -la server/src
name: Server CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  validate-and-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache server node_modules
        uses: actions/cache@v4
        with:
          path: server/node_modules
          key: server-node-${{ runner.os }}-${{ hashFiles('server/package-lock.json') }}
          restore-keys: |
            server-node-${{ runner.os }}-

      - name: Cache Prisma engines
        uses: actions/cache@v4
        with:
          path: ~/.cache/prisma
          key: prisma-engines-${{ runner.os }}-${{ hashFiles('server/package-lock.json') }}
          restore-keys: |
            prisma-engines-${{ runner.os }}-

      - name: Install server dependencies
        working-directory: server
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Prisma generate
        working-directory: server
        run: npx prisma generate

      - name: Prisma validate
        working-directory: server
        run: npx prisma validate

      - name: Lint (ESLint)
        working-directory: server
        run: npm run lint

      - name: Format check (Prettier)
        working-directory: server
        run: npm run format:check

      - name: Basic listing
        run: ls -la server/src

  smoke-test:
    runs-on: ubuntu-latest
    needs: [validate-and-format]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache server node_modules
        uses: actions/cache@v4
        with:
          path: server/node_modules
          key: server-node-${{ runner.os }}-${{ hashFiles('server/package-lock.json') }}
          restore-keys: |
            server-node-${{ runner.os }}-

      - name: Install server dependencies
        working-directory: server
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Smoke test - start server and curl /api/health
        working-directory: server
        env:
          DATABASE_URL: "mysql://root:password@localhost:3306/travelgo"
          JWT_SECRET: "ci-secret"
          ADMIN_EMAIL: "admin@example.com"
          ADMIN_PASSWORD: "admin123"
        run: |
          node ./src/index.js & SERVER_PID=$!
          timeout 15 bash -c 'until curl -sSf http://localhost:4000/api/health > /dev/null; do sleep 1; done'
          curl -sSf http://localhost:4000/api/health || (echo "Health check failed" && exit 1)
          kill $SERVER_PID || true
<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>TravelGo SPA (React thuần, không Vite)</title>
    <link rel="stylesheet" href="/globals.css" />
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
      .container { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
      .nav { display:flex; gap:12px; padding:12px 0; border-bottom: 1px solid rgba(0,0,0,.1); }
      .card { border: 1px solid rgba(0,0,0,.08); border-radius: 12px; padding: 16px; }
      .btn { display:inline-block; padding: 8px 12px; border-radius: 999px; border: 1px solid rgba(0,0,0,.1); }
      .btn-primary { background: black; color: white; border-color: black; }
      a { color: inherit; text-decoration: none; }
      a:hover { text-decoration: underline; }
    </style>
    <script type="module">
      import React from "https://esm.sh/react@18";
      import { createRoot } from "https://esm.sh/react-dom@18/client";
      import { App } from "./spa-app.js";

      const el = document.getElementById("root");
      createRoot(el).render(React.createElement(App));
    </script>
  </head>
  <body>
    <div class="container nav">
      <a href="/spa/index.html">Trang chủ (SPA)</a>
      <a href="/destinations">Destinations (Next)</a>
      <a href="/deals">Deals (Next)</a>
      <a href="/">Trang Next.js</a>
    </div>
    <main id="root" class="container"></main>
  </body>
</html>
